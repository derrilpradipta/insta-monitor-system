services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: instaprint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ubah-password-ini}
      POSTGRES_DB: instaprint_monitor
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instaprint -d instaprint_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://instaprint:${POSTGRES_PASSWORD:-ubah-password-ini}@db:5432/instaprint_monitor?schema=public
      DIRECT_URL: postgresql://instaprint:${POSTGRES_PASSWORD:-ubah-password-ini}@db:5432/instaprint_monitor?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      SESSION_IDLE_MINUTES: 30
      SOURCE_WEBSITE_URL: ${SOURCE_WEBSITE_URL:-https://www.instasiaga.com}
      SOURCE_LOGIN_URL: ${SOURCE_LOGIN_URL:-https://www.instasiaga.com/login}
      SOURCE_ORDERS_URL: ${SOURCE_ORDERS_URL:-https://www.instasiaga.com/order_list}
      SCRAPER_USERNAME: ${SCRAPER_USERNAME}
      SCRAPER_PASSWORD: ${SCRAPER_PASSWORD}
      SCRAPER_HEADLESS: "true"
      ENABLE_INTERNAL_CRON: "1"
      CRON_SECRET: ${CRON_SECRET}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "3000:3000"
    # Chromium butuh shared memory lebih besar
    shm_size: "1gb"

volumes:
  db_data:
